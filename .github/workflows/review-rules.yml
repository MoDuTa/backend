name: 리뷰 규칙
# PR 작성자가 Reviewers에 지정한 사람이 모두 Approve해야 통과합니다 (docs/review.md).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
concurrency:
  group: review-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  approval:
    name: 리뷰 승인 규칙
    if: ${{ contains(fromJSON('["develop", "main"]'), github.event.pull_request.base.ref) }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: 승인 확인
        # bash로 지정하면 pipefail이 켜져, 리뷰 이력 조회가 중간에 실패해도 통과하지 않습니다.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 리뷰를 남기면 GitHub의 "요청된 리뷰어" 목록에서 빠지므로, 지정 이력(이벤트)으로 리뷰어를 찾습니다.
          reviewers="$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '.[] | select(.event == "review_requested" or .event == "review_request_removed") | select(.requested_reviewer != null) | "\(.event) \(.requested_reviewer.login)"' \
            | awk '$1 == "review_requested" { on[$2] = 1 } $1 == "review_request_removed" { on[$2] = 0 } END { for (u in on) if (on[u]) print u }' \
            | sort)"
          if [[ -z "$reviewers" ]]; then
            echo "::error::Reviewers에 리뷰어를 지정해 주세요. 지정한 뒤 Discord에 리뷰 요청을 남깁니다."
            exit 1
          fi
          # 리뷰는 시간순으로 옵니다. 코멘트만 남긴 리뷰는 승인 상태를 바꾸지 않으므로 뺍니다.
          states="$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.state != "COMMENTED") | "\(.user.login) \(.state)"')"
          status=0
          for who in $reviewers; do
            state="$(printf '%s\n' "$states" | awk -v who="$who" '$1 == who { s = $2 } END { print s }')"
            if [[ "$state" == APPROVED ]]; then
              echo "@$who Approve 확인"
            else
              echo "::error::@$who 의 Approve가 필요합니다. (현재 상태: ${state:-리뷰 전})"
              status=1
            fi
          done
          exit $status
